/* Studio ideas are planning records, independent of simulated runs. */
.studio-app .workspace { padding-bottom: 40px; }
.studio-app .topactions { flex-wrap: wrap; }
.studio-launchpad { --studio-gap: 18px; min-width: 0; }
.studio-launchpad [hidden] { display: none !important; }
.studio-launchpad h2, .studio-launchpad h3, .studio-launchpad p { margin: 0; }
.studio-launchpad h2 { font-size: 20px; line-height: 1.35; }
.studio-launchpad h3 { font-size: 14px; line-height: 1.4; }
.studio-launchpad p { line-height: 1.6; }
.studio-intro { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 18px; }
.studio-intro p { max-width: 75ch; margin-top: 6px; color: var(--muted); font-size: 12px; }
.studio-eyebrow { color: var(--accent); font-size: 10px; font-weight: 650; letter-spacing: .8px; text-transform: uppercase; margin-bottom: 5px; }
.studio-context { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 18px; }
.studio-context > summary { padding: 14px 16px; font-size: 12px; font-weight: 600; }
.studio-context-body { padding: 0 16px 16px; }
.studio-context-body > p { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.studio-context .studio-fields { margin-top: 0; }
.studio-toolbar, .studio-editor-heading, .studio-section-heading { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.studio-toolbar { margin-bottom: 15px; }
.studio-toolbar-actions, .studio-editor-actions { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.studio-examples { position: relative; font-size: 12px; }
.studio-examples > summary { padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.studio-example-options { position: absolute; z-index: 5; right: 0; top: calc(100% + 6px); width: min(350px, calc(100vw - 90px)); max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 25px #0002; border-radius: 8px; }
.studio-example-options button { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 4px; }
.studio-example-options button strong { font-size: 12px; }
.studio-example-options button span { font-size: 11px; color: var(--muted); line-height: 1.5; }
.studio-launchpad .studio-button { padding: 9px 12px; font-size: 12px; }
.studio-launchpad .studio-button[aria-pressed=true] { background: var(--selected); border-color: var(--accent); color: var(--accent); }
.studio-tabs, .studio-sections, .studio-phases { display: flex; gap: 5px; flex-wrap: wrap; }
.studio-tabs button, .studio-sections button, .studio-phases button { font-size: 12px; padding: 8px 11px; background: var(--surface); }
.studio-tabs button[aria-pressed=true], .studio-sections button[aria-pressed=true], .studio-phases button[aria-pressed=true] { color: var(--accent); border-color: var(--accent); background: var(--selected); }
.studio-layout { display: grid; grid-template-columns: minmax(190px, 235px) minmax(0, 1fr); gap: var(--studio-gap); align-items: start; }
.studio-library { min-width: 0; }
.studio-library-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 0 10px; }
.studio-count, .studio-muted { color: var(--muted); font-size: 12px; }
.studio-idea-list { display: flex; flex-direction: column; gap: 8px; }
.studio-launchpad .studio-idea { width: 100%; padding: 13px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.studio-idea > strong { font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
.studio-idea > span { font-size: 11px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
.studio-launchpad .studio-idea[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 3px 0 var(--accent); background: var(--selected); }
.studio-idea-meta { display: flex; flex-wrap: wrap; gap: 5px; }
.studio-tag { font-size: 10px; display: inline-block; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--raised); line-height: 1.4; }
.studio-tag.example { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
.studio-editor { padding: 20px; min-width: 0; }
.studio-editor-heading { align-items: flex-start; margin-bottom: 15px; }
.studio-editor-heading p { margin-top: 5px; font-size: 11px; color: var(--muted); }
.studio-identity { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 18px; align-items: start; margin-bottom: 18px; }
.studio-sections { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 18px; }
.studio-section-heading { margin: 0 0 12px; align-items: flex-start; }
.studio-section-heading p { max-width: 70ch; margin-top: 4px; color: var(--muted); font-size: 12px; }
.studio-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; margin-top: 15px; }
.studio-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--ink); font-size: 12px; }
.studio-field.wide { grid-column: 1 / -1; }
.studio-field-label { font-weight: 550; }
.studio-field input, .studio-field select, .studio-field textarea { width: 100%; min-width: 0; padding: 10px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; }
.studio-field input, .studio-field select { min-height: 42px; }
.studio-field textarea { min-height: 80px; line-height: 1.6; resize: vertical; }
.studio-field small { color: var(--muted); font-size: 11px; line-height: 1.5; }
.studio-field input[aria-invalid=true], .studio-field textarea[aria-invalid=true] { border-color: var(--negative); }
.studio-launchpad .studio-field-error { color: var(--negative); }
.studio-launchpad :is(input, select, textarea, button, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.studio-callout { padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--selected); font-size: 12px; line-height: 1.6; margin: 15px 0; }
.studio-callout.unknown { background: var(--raised); border-left-color: var(--line); color: var(--muted); }
.studio-callout.warning { background: var(--warn-bg); border-left-color: var(--warn); color: var(--warn); }
.studio-callout p + p { margin-top: 6px; }
.studio-more { margin-top: 18px; border-top: 1px solid var(--line); }
.studio-more > summary { padding: 13px 0; font-size: 12px; font-weight: 600; }
.studio-more .studio-fields { margin-top: 0; }
.studio-numbers-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(210px, 1fr); gap: 20px; align-items: start; }
.studio-numbers-layout .studio-fields { margin-top: 0; }
.studio-economics { padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); min-width: 0; }

 function summary(section,item){if(section==='pools')return raw(item.hours)+' delivery hours at $'+raw(item.rate)+'/hour';if(section==='expenses')return '$'+raw(item.amount)+' per 30 days';return raw(item.quantity)+' × '+raw(item.unit,'engagement')+' at $'+raw(item.price)+' per unit';}

async function initializeStorage(){

 try{
  const localFingerprint=await MEIQQStorage.fingerprint(localRevision);
  backend=await MEIQQStorage.connect(indexedDB,KEY);
  if(backend.raw!==undefined){
   try{
    const primary=MEIQQWorkspace.parseText(backend.raw);retainLegacySource(backend.raw,primary);
    const {state:run,saved:checkpoints,draft:setup,checkpointInfo:info,recoveryFiles:files}=primary;
    const current={state:run,saved:checkpoints,draft:setup,checkpointInfo:info,recoveryFiles:files};
    // The legacy/fallback store may contain newer work from an outage. Its age
    // cannot be inferred safely, so preserve both instead of dropping one.
    const combined=primary.archives;
    if(localRevision!==null&&localRevision!==backend.raw&&(!localFingerprint||localFingerprint!==backend.fallbackFingerprint)){
     for(const a of archives)MEIQQWorkspace.archive(combined,a.workspace,a.label);
     if(JSON.stringify(currentWorkspace())!==JSON.stringify(current)){
      MEIQQWorkspace.archive(combined,currentWorkspace(),'Browser fallback · '+state.config.name+' · day '+state.day);
      fallbackPreserved=true;
     }
    }
    installWorkspace({...primary,archives:combined});recoveryRaw=null;recoveryReason='';storeError=false;
   }catch(e){
    if(recoveryRaw!==null&&recoveryRaw!==backend.raw)recoveryFiles.push({name:'Unreadable fallback save',text:recoveryRaw});
    recoveryRaw=backend.raw;recoveryReason=e.message;storeError=true;
   }
  }
  saveWriter=MEIQQStorage.writer(text=>backend.write(text,localFingerprint),persistenceStatus);
 }catch(e){
  backend=null;
  if(e.code==='STORAGE_READ_FAILED'){
   primaryReadFailed=true;storeError=true;saveStatus='error';
   storeReason='Your primary save could not be read. Back up this session and reopen the app before continuing; browser saving is disabled.';
  }
 }
 loading=false;render();save();
}

function renderKey(node){

 if(node.hasAttribute('data-action')){
  const parts=['data-action','data-id','data-index','data-view','data-step','data-mode','data-kind','data-tab','data-type','data-entry-id','data-delta'].map(name=>node.getAttribute(name)||'');
  return 'action:'+parts.join(':');

function sameRenderNode(current,next){return current?.nodeType===next?.nodeType&&(current.nodeType!==1||current.localName===next.localName);}
function patchRenderNode(current,next){

 for(const attr of [...current.attributes])if(!next.hasAttribute(attr.name))current.removeAttribute(attr.name);
 for(const attr of [...next.attributes])if(current.getAttribute(attr.name)!==attr.value)current.setAttribute(attr.name,attr.value);
 patchRenderChildren(current,next);
 if(current.localName==='input'){
  if(document.activeElement!==current&&current.value!==next.value)current.value=next.value;
  current.checked=next.checked;
 }
 if(current.localName==='select'&&current.value!==next.value)current.value=next.value;

}
function patchRenderChildren(current,next){
 let cursor=current.firstChild;
 for(const nextChild of [...next.childNodes]){
  const key=renderKey(nextChild);let match=null;
  if(key){for(let candidate=cursor;candidate;candidate=candidate.nextSibling)if(renderKey(candidate)===key&&sameRenderNode(candidate,nextChild)){match=candidate;break;}}
  else if(cursor&&!renderKey(cursor)&&sameRenderNode(cursor,nextChild))match=cursor;
  if(!match){match=nextChild.cloneNode(true);current.insertBefore(match,cursor);}
  else {if(match!==cursor)current.insertBefore(match,cursor);patchRenderNode(match,nextChild);}
  cursor=match.nextSibling;
 }

}
function patchableRoot(root){

  if(property==='innerHTML'){
   const template=document.createElement('template');template.innerHTML=value;
   patchRenderChildren(target,template.content);return true;
  }
  return Reflect.set(target,property,value,target);
 }});
}

function mixValid(){return Math.abs(draft.services.reduce((n,s)=>n+s.weight,0)-100)<0.01;}
function draftError(){return issueText(QQ.configIssues(draft)[0]);}
function workloadRow(label,used,available){const ratio=available?used/available:used?Infinity:0;return `<div class="capacity-row"><div><b>${label}</b><span>${num(used)} / ${num(available)} h</span></div><div class="track"><div class="fill ${ratio>1?'warn':''}" style="width:${Math.min(100,ratio*100)}%"></div></div><small>${available===0&&used>0?'No capacity available':ratio>1?num(used-available)+' hours over capacity':num(Math.max(0,available-used))+' hours spare'}</small></div>`;}
function draftSummary(){const error=draftError(),changed=dirty();let e;try{e=QQ.estimate(draft);}catch(err){}return `<section class="panel summary-card"><div class="eyebrow">DRAFT PREVIEW · FIRST 30 DAYS</div><h2>What your setup implies</h2><p class="helper">22 working days. New business only, before queue delays and returning clients.</p>${error?`<div class="banner danger" role="alert">${esc(error)}</div>`:''}${!error&&e&&Object.values(e).every(v=>typeof v!=='number'||!Number.isNaN(v))?`<div class="summary-numbers"><div><strong>${num(e.orders)}</strong><small>Expected new orders</small></div><div><strong>${money(e.profit)}</strong><small>Potential operating result</small></div></div>${e.unserved>0?`<p class="helper">${num(e.unserved)} inquiries have no matching offering.</p>`:''}${workloadRow('Your time',e.owner,e.ownerCapacity)}${workloadRow('Design team',e.hours,e.designCapacity)}<div class="minirow"><span>Potential revenue</span><b>${money(e.revenue)}</b></div><div class="minirow"><span>After valuing your time</span><b>${money(e.surplus)}</b></div>${draft.acquisition==='sales'&&draft.outreachHours>draft.ownerHours?'<p class="error-text">Outreach is capped by your available hours and leaves no time for quoting.</p>':''}`:''}<div class="divider"></div>${btn(changed?'Review & apply changes':'Go to workflow','review','primary full',error?'disabled':'')}${changed?btn('Cancel all draft changes','discard','ghost full'):''}</section>`;}

function mapView(m){

 return `${state.day===0?`<div class="welcome-run"><div><h2>Ready when you are.</h2><p>Press <b>1 day</b> to follow the first inquiry, or <b>Run</b> to watch the business progress.</p></div>${btn('Open worked example','example','soft')}</div>`:''}<div class="metrics">${metric('Cash available',money(state.cash),'Receipts minus payments','accent')}${metric('Operating result',money(m.profit),'Delivered revenue minus all incurred costs',m.profit<0?'negative':'')}${metric('Your time',num(state.ownerHours)+' h',num(m.ownerOpenHours)+' h still queued')}${metric('Late open deliveries',m.late,m.quoteCount+' quotes open · oldest '+m.oldestQuoteAge+' d',m.late?'negative':'')}</div>${workflowPath()}<div class="workgrid"><div><section class="panel"><div class="panelhead"><div><h2>Work queues by responsibility</h2><p class="helper">Each lane shows who can move the work now; the handoff path above shows project order.</p></div><span class="tag">${m.active} ACTIVE</span></div><div class="lanes">${WORKFLOW_LANES.map(lane=>{const stages=laneStages(lane),count=state.projects.filter(p=>stages.includes(p.stage)).length;return `<section class="work-lane" data-lane="${lane.id}"><div class="lane-heading">${icon(lane.icon)}<div><h3>${esc(lane.name)}</h3><small>${esc(lane.helper)} · ${count} waiting</small></div></div><div class="stage-grid ${stages.length===1?'single':''}">${stages.map(s=>stageCard(s,b)).join('')}</div></section>`;}).join('')}</div><div class="mapfooter">${m.unserved?`<span>${m.unserved} inquiries outside current offerings</span>`:''}<span>Model ${state.modelVersion||1} · ${esc(state.workloadId||'legacy workload')}</span>${btn(m.complete+' completed projects','filter-complete','small')}</div></section><div class="insight-card panel"><h2>${b?'Where work is collecting':'What to look for'}</h2>${b?`${insight}<div class="actions">${btn('Inspect this queue','stage','soft','data-id="'+b.stage+'"')}${b.resource!=='external'?btn('Adjust team capacity','team','small'):''}</div>`:'<p class="helper">Advance time and watch queues build. Select a project to see why it is waiting and who can move it forward.</p>'}</div></div><aside class="inspector panel" id="inspector">${inspector()}</aside></div>`;

function recoverableDraft(file){
 try{
  if(file.name==='Recovered unfinished draft'){
   const result=MEIQQWorkspace.parse({version:2,state,saved:[],draft:JSON.parse(file.text)});
   return result.recoveryFiles.length?null:result.draft;
  }
  if(file.name==='Original save before migration'){
   const result=MEIQQWorkspace.parseText(file.text);
   return result.recoveryFiles.length?null:result.draft;
  }
 }catch(e){}
 return null;
}

function aboutView(){return `<div class="two-col"><section class="panel padded"><div class="eyebrow">SIMULATION MODEL ${state.modelVersion||1}</div><h2>Start with one experiment</h2><ol><li>Set service prices, hours, inquiry shares and available capacity.</li><li>Review the draft preview, then apply the setup.</li><li>Step through a day or run a month.</li><li>Inspect the queue that grows and the projects inside it.</li><li>Branch, change one input, restart and compare at the same day with the same workload ID.</li></ol><h2>What the numbers mean</h2><p>Inquiries are stable external-demand identities derived from the workload seed, arrival day and arrival index. Capacity can change delivery and renewal timing, but it does not reroll unrelated leads.</p><p>Conversion is the share of new-business quotes that accept. Confirmed repeats and paid-cycle renewals bypass new-sales conversion. A deposit is received on acceptance; revenue is recognized on delivery.</p><p>The instant preview is a full-fulfillment demand ceiling for the first 30 calendar days and 22 working days. It excludes queue timing, returning clients and uncertainty.</p><p>Operating result is delivered revenue less incurred costs, including unfinished work. The owner-time target revalues all recorded owner hours at its current value and is not a cash payment.</p></section><section class="panel padded"><h2>Model 2 daily order</h2><p>Each day processes due client collections, monthly overhead, confirmed repeat cycles, new external demand, outreach, then scheduled work. A failed payment rolls back the proposed day atomically.</p><p>Zero-duration transitions may continue on the same day under a bounded loop. Real work still consumes weekday capacity; genuine client and supplier waits remain calendar delays.</p><p>Owner capacity is shared across quotes, review and delivery. Design capacity is pooled across projects, but one project can use at most one designer’s daily availability. Multiple projects can proceed in parallel when multiple designers are available.</p><p>Quote effort locks when an inquiry arrives. Price, service scope, delivery effort, payment terms, approval time, print time and delivery promise lock when the quote is accepted. Agreed deadlines cannot be changed before acceptance.</p><p>Monthly and seasonal campaign relationships last one year, with every campaign quoted and paid separately. A declined campaign skips one cycle; another quote follows at the next cadence within the relationship. Future revenue is not guaranteed. Older paid-cycle services keep their confirmed-renewal behavior after delivery and payment. Customer print choice locks at acceptance: managed printing includes the supplier batch; files-only delivery skips production and printer costs. Client, contract, fulfillment, payment and renewal states are stored separately.</p><h2>Business profiles</h2><p>New workspaces draw from illustrative food, retail and local-service business types. Customer mix, niche focus and workflow variation affect work, approval and repeat behavior; targeted offerings serve only matching groups.</p><h2>Prototype limits</h2><p>Published design and print prices are frozen comparables. Package prices, work estimates, demand, customer printing preferences and disruption rates are modeled assumptions with documented derivations, not measured results for your business. Named staff, supplier comparisons, borrowing and native Windows/Mac installers remain future work. Backups include model and workload identities.</p></section></div>`;}

function serviceChangeSummary(service){

 if(service.fulfillment)terms.push(pct(service.fulfillment.managedShare)+' managed print',money(service.fulfillment.designOnlyPrice)+' files-only');

function scopeDiffValue(key,value){

  else if(a==='example'){stop();modal(`<h2 id="dialog-title">Open a worked example?</h2><p>Load a hypothetical studio on day 12, with projects to inspect. Your complete workspace will be preserved inside the app, including checkpoints and unfinished inputs.</p><div class="actions">${btn('Cancel','close')}${btn('Preserve & open example','confirm-example','primary')}</div>`);render();}
  else if(a==='confirm-example'){archiveCurrent();state=QQ.fresh();saved=[];checkpointInfo=[];recoveryFiles=[];recoveryRaw=null;for(let i=0;i<12;i++)QQ.step(state);draft=QQ.clone(state.config);view='map';selection=null;closeModal();render();}
  else if(a==='cash')cashModal();
  else if(a==='fund'){modal(`<h2 id="dialog-title">Add owner funding</h2><p>Cash increases. Revenue and profit do not change.</p><label class="input-field">Amount ($)<input id="funding" type="number" min="0.01" max="100000000" step="0.01" value="1000"></label><div class="actions">${btn('Cancel','close')}${btn('Add funding','confirm-fund','primary')}</div>`);render();}
  else if(a==='confirm-fund'){const f=$('#funding');if(!f.checkValidity())return f.reportValidity();QQ.fund(state,Number(f.value));closeModal();render();}
  else if(a==='backup'){download('MEIQQ-Backup-Day-'+state.day+'.json',MEIQQWorkspace.serialize(currentWorkspace(),archives));toast('Backup download requested. Unfinished inputs and preserved workspaces are included.');}
  else if(a==='recover')download('MEIQQ-original-save.json',recoveryRaw);
  else if(a==='import')importFile();
  else if(a==='confirm-import'){if(!pendingImport)throw Error('Choose a backup first.');openImportedWorkspace(pendingImport);pendingImport=null;view=state.day?'map':'setup';closeModal();render();}
else if(a==='open-archive'){
   const index=Number(el.dataset.index),item=archives[index];if(!item)throw Error('Workspace not found.');
   const next=QQ.clone(item.workspace),rest=archives.filter((_,i)=>i!==index);
   MEIQQWorkspace.archive(rest,currentWorkspace());installWorkspace({...next,archives:rest});recoveryRaw=null;selection=null;render();
  }
  else if(a==='export-archive'){const item=archives[Number(el.dataset.index)];if(!item)throw Error('Workspace not found.');download('MEIQQ-Preserved-Workspace.json',MEIQQWorkspace.serialize(item.workspace));}
  else if(a==='recovery-file'){const file=recoveryFiles[Number(el.dataset.index)];if(!file)throw Error('Recovery file not found.');download('MEIQQ-Recovered-Original.json',file.text);}
  else if(a==='restore-original-draft'){
   const file=recoveryFiles[Number(el.dataset.index)];pendingDraft=file&&recoverableDraft(file);
   if(!pendingDraft)throw Error('This original does not contain a usable draft. Download it to inspect it.');
   modal(`<h2 id="dialog-title">Restore these setup inputs?</h2><p>The active run and its projects stay in place. Your current workspace will be preserved under Runs & backups before the unfinished draft changes.</p><div class="actions">${btn('Cancel','close')}${btn('Restore draft','confirm-restore-draft','primary')}</div>`);
  }
  else if(a==='confirm-restore-draft'){
   if(!pendingDraft)throw Error('Choose an original draft first.');
   archiveCurrent('Before draft recovery · '+state.config.name+' · day '+state.day);
   draft=QQ.clone(pendingDraft);pendingDraft=null;view='setup';stepIndex=0;closeModal();render();
  }
  else if(a==='rename-checkpoint'){const i=Number(el.dataset.index);modal(`<h2 id="dialog-title">Name this checkpoint</h2><label class="input-field">Name<input id="checkpoint-name" maxlength="100" value="${esc(checkpointInfo[i].label)}"></label><div class="actions">${btn('Cancel','close')}${btn('Save name','confirm-rename','primary',`data-index="${i}"`)}</div>`);}
  else if(a==='confirm-rename'){const i=Number(el.dataset.index),label=$('#checkpoint-name').value.trim();if(!label||label.length>100)throw Error('Enter a name up to 100 characters.');checkpointInfo[i]={label,kind:'manual',baseline:Boolean(checkpointInfo[i].baseline)};closeModal();render();}
  else if(['delete-checkpoint','delete-archive'].includes(a)){const kind=a==='delete-checkpoint'?'checkpoint':'workspace';modal(`<h2 id="dialog-title">Delete this ${kind}?</h2><p>This removes the saved copy from this browser. Existing downloaded backups keep their copy.</p><div class="actions">${btn('Cancel','close')}${btn('Delete saved copy','confirm-delete','primary',`data-kind="${kind}" data-index="${Number(el.dataset.index)}"`)}</div>`);}
  else if(a==='confirm-delete'){const i=Number(el.dataset.index);if(el.dataset.kind==='checkpoint'){saved.splice(i,1);checkpointInfo.splice(i,1);}else archives.splice(i,1);closeModal();render();}
  else if(a==='close'){closeModal();render();}
  if(['confirm-catalog-service','add-blank-service','add-starter','confirm-starter','undo-services','use-service-price','apply','confirm-preset','undo-preset','discard','enable-profiles','add-service','duplicate','remove-service','balance','priority','deadline','approve','checkpoint','pin-baseline','confirm-branch','load','confirm-restart','confirm-example','confirm-fund','confirm-import','open-archive','confirm-restore-draft','confirm-rename','confirm-delete'].includes(a))save();
 }catch(err){showError(err.message||'The action could not be completed.');}finally{actionFocus=null;}
});
document.addEventListener('keydown',e=>{
 const tab=e.target?.closest?.('[role="tab"][data-action="setup-step"]');
 if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
  e.preventDefault();const current=Number(tab.dataset.step),next=e.key==='Home'?0:e.key==='End'?steps.length-1:(current+(e.key==='ArrowRight'?1:-1)+steps.length)%steps.length;
  stepIndex=next;render();setTimeout(()=>document.querySelector('#setup-tab-'+next)?.focus(),0);return;
 }
 if(!$('#modal').firstChild)return;
 if(e.key==='Escape'){closeModal();render();}
 if(e.key==='Tab'){const els=modalTabStops();if(!els.length)return;e.preventDefault();const current=els.indexOf(document.activeElement),next=current<0?(e.shiftKey?els.length-1:0):(current+(e.shiftKey?-1:1)+els.length)%els.length;els[next].focus();}
});
window.addEventListener('beforeunload',e=>{save();studioSession.save();jobsSession.save();plannerSession.save();if(plannerSession.unsaved||jobsSession.unsaved||studioSession.unsaved||storeError||saveStatus==='saving'||saveStatus==='pending'||recoveryRaw!==null||primaryReadFailed){e.preventDefault?.();e.returnValue='';}});
render();
const appReady=initializeStorage();
const studioReady=studioSession.open().then(()=>{if(view==='studio'||view==='planner')render();});
const jobsReady=jobsSession.open().then(()=>{if(view==='jobs')render();});
const plannerReady=plannerSession.open().then(()=>{plannerController.initialize();if(view==='planner')render();});

function analyticsRate(v){return v===null?'—':(v*100).toFixed(1)+'%';}
function analyticsMoney(v){return v===null?'—':money(v);}
function analyticsRows(rows){return rows.map(([label,value])=>`<div class="minirow"><span>${label}</span><b>${value}</b></div>`).join('');}
function analyticsTable(headers,rows,empty='No results yet. Advance the simulation to populate this view.'){
 return `<div class="tablewrap analytics-table"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`;
}
function resultCell(value){return `<td class="${value<0?'negative':''}">${money(value)}</td>`;}
function financeView(m){
 const a=QQ.analytics(state);
 return `<div class="analytics-context"><span><b>${esc(state.config.name)}</b> · Day ${state.day} of ${state.config.months*30}</span><span>USD · Cumulative results unless labeled monthly</span></div>
 <div class="analytics-tabs" role="group" aria-label="Results sections">${[['overview','Profit overview'],['contracts','Contracts'],['performance','Simulation stats'],['cash','Cash & ledger']].map(([id,name])=>btn(name,'analytics-tab',analyticsTab===id?'active':'',`data-tab="${id}" aria-pressed="${analyticsTab===id}"`)).join('')}</div>
 <div class="analytics-content">${analyticsTab==='contracts'?contractAnalyticsView(a):analyticsTab==='performance'?simulationAnalyticsView(a,m):analyticsTab==='cash'?cashFinanceView(m):marginAnalyticsView(a,m)}</div>`;
}
function marginAnalyticsView(a,m){
 const rate=analyticsRate;
 const insight=!state.revenue?'No delivered revenue yet. Booked work and deposits will become revenue when delivery occurs.':a.profit<0?'Operating costs exceed delivered revenue so far. The bridge below separates unfinished work from delivered-work costs.':a.afterOwner<0?'Operating result is positive, but it does not yet cover your chosen value for owner time.':'Delivered revenue covers incurred operating costs and your current owner-time target.';
 return `<div class="metrics">${metric('Delivered revenue',money(state.revenue),m.delivered+' delivered cycles','accent')}${metric('Contribution margin',rate(a.contributionMargin),money(a.contribution)+' after delivered direct costs')}${metric('Operating margin',rate(a.operatingMargin),money(a.profit)+' after all incurred costs',a.profit<0?'negative':'')}${metric('After owner-time margin',rate(a.afterOwnerMargin),money(a.afterOwner)+' after your time target',a.afterOwner<0?'negative':'')}</div>
 <p class="analytics-insight">${insight}</p><div class="two-col"><section class="panel padded"><h2>Revenue → operating result</h2>${analyticsRows([['Delivered revenue',money(state.revenue)],['− Direct costs on delivered work',money(a.deliveredCost)],['= Delivered contribution',money(a.contribution)],['− Costs on unfinished work',money(a.unfinishedCost)],['− Shared overhead',money(a.overhead)],['= Operating result',money(a.profit)],['− Owner time at current target',money(a.ownerTime)],['= Result after owner time',money(a.afterOwner)]])}<p class="helper">Direct costs include design labor and print/shipping. Margin = result ÷ delivered revenue; shown as — when revenue is zero. Owner time is valued at the current ${money(state.config.ownerTarget)}/h across the entire run.</p></section>
 <section class="panel padded"><h2>Cash, pipeline & efficiency</h2>${analyticsRows([['Cash available',money(state.cash)],['Accepted work still to deliver',money(a.backlog)],['Delivered balances to collect',money(m.receivable)],['Average accepted cycle value',analyticsMoney(a.averageOrder)],['Operating result / owner hour',analyticsMoney(a.profitPerOwnerHour)],['On-time delivery',rate(m.onTimeRate)],['Delivered in last 30 days',m.throughput30]])}<p class="helper">Booked work is not earned revenue. Cash includes deposits and owner funding. These results describe this simulation, not a forecast independent of your assumptions.</p>${btn('Inspect contracts','analytics-tab','soft','data-tab="contracts"')}</section></div>
 <section class="panel analytics-section"><div class="panelhead"><div><h2>Which services contribute most?</h2><p class="helper">Ranked by contribution dollars · excludes shared overhead and owner time</p></div></div>${analyticsTable(['Service','Delivered','Revenue','Direct cost¹','Contribution','Margin','Unfinished cost'],a.services.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.delivered}</td><td>${money(s.revenue)}</td><td>${money(s.deliveredCost)}</td>${resultCell(s.contribution)}<td>${rate(s.margin)}</td><td>${money(s.unfinishedCost)}</td></tr>`))}<p class="helper analytics-note">¹ Direct cost for delivered work only. Service changes remain grouped under their original service identity.</p></section>`;
}
function filteredContracts(a){
 const query=contractSearch.trim().toLowerCase();
 return a.contracts.filter(c=>(!query||(c.client+' '+c.id).toLowerCase().includes(query))&&(contractFilter==='all'||contractFilter==='open'&&c.open>0||contractFilter==='receivable'&&c.receivable>0||contractFilter==='negative'&&c.afterOwner<0)).sort((x,y)=>{
  if(contractSort==='margin'){if(x.margin===null)return y.margin===null?x.id.localeCompare(y.id):1;if(y.margin===null)return -1;}
  return (y[contractSort]??0)-(x[contractSort]??0)||x.id.localeCompare(y.id);
 });
}
function contractAnalyticsView(a){
 const filtered=filteredContracts(a),pages=Math.max(1,Math.ceil(filtered.length/20));contractPage=Math.min(contractPage,pages-1);
 const visible=filtered.slice(contractPage*20,contractPage*20+20);
 const options=(list,value)=>list.map(([v,l])=>`<option value="${v}" ${value===v?'selected':''}>${l}</option>`).join('');
 return `<div class="metrics">${metric('Contracts',a.contracts.length,'All accepted client relationships')}${metric('Booked value',money(a.contracts.reduce((n,c)=>n+c.booked,0)),'All accepted cycles, including delivered')}${metric('Delivered receivables',money(a.contracts.reduce((n,c)=>n+c.receivable,0)),'Positive balances still to collect')}${metric('Below owner-time target',a.contracts.filter(c=>c.afterOwner<0).length,'To date; excludes shared overhead')}</div>
 <section class="panel"><div class="panelhead"><div><h2>Contract economics</h2><p class="helper">One row per contract · expand a client for cycle details</p></div></div><div class="analytics-tools"><label class="search-label">Find client or contract<input id="contract-search" type="search" value="${esc(contractSearch)}" placeholder="Client name or contract ID" /></label><label class="search-label">Show<select id="contract-filter">${options([['all','All contracts'],['open','Awaiting delivery'],['receivable','Balance to collect'],['negative','Below owner-time target']],contractFilter)}</select></label><label class="search-label">Rank by<select id="contract-sort">${options([['contribution','Contribution · high to low'],['margin','Margin · high to low'],['revenue','Revenue · high to low'],['receivable','Receivable · high to low'],['afterOwner','After owner time · high to low']],contractSort)}</select></label></div>
 ${analyticsTable(['Client / contract','Delivered / accepted','Revenue','Contribution','Margin','Receivable','After owner time*'],visible.map(c=>`<tr data-render-key="contract-row-${esc(c.id)}"><td><details data-disclosure="contract-${esc(c.id)}"><summary id="contract-summary-${esc(c.id)}">${esc(c.client)}</summary><div class="contract-detail"><small>${esc(c.id)} · ${c.kind==='campaign-relationship'?'Yearly campaign relationship':c.kind==='paid-cycle'?'Paid-cycle subscription':'Repeat-purchase contract'}</small>${analyticsRows([...(c.kind==='campaign-relationship'?[['Campaign interval',c.cadenceDays+' days'],['Relationship ends','Day '+c.relationshipEndDay],['Next quote',c.nextQuoteDay===null?'Not scheduled':'Day '+c.nextQuoteDay],['Skipped campaigns',c.skippedCampaigns||0]]:[]),['Booked value',money(c.booked)],['Collected, including deposits',money(c.collected)],['Costs on unfinished work',money(c.unfinishedCost)],['Open delivery cycles',c.open],['Owner / design hours',num(c.ownerHours)+' / '+num(c.designHours)]])}<div class="actions">${c.projects.map(id=>btn(esc(id),'project','table-link',`data-id="${esc(id)}"`)).join('')}</div></div></details></td><td>${c.delivered} / ${c.cycles}</td><td>${money(c.revenue)}</td>${resultCell(c.contribution)}<td>${analyticsRate(c.margin)}</td><td>${money(c.receivable)}</td>${resultCell(c.afterOwner)}</tr>`),'No contracts match. Contracts appear after quotes are accepted.')}
 <div class="analytics-pagination"><span>${filtered.length?contractPage*20+1:0}–${Math.min((contractPage+1)*20,filtered.length)} of ${filtered.length} contracts · totals above cover all contracts</span><div class="actions">${btn('Previous','contract-page','small',`data-delta="-1" ${contractPage===0?'disabled':''}`)}${btn('Next','contract-page','small',`data-delta="1" ${contractPage===pages-1?'disabled':''}`)}</div></div></section>
 <p class="helper">Contribution = delivered revenue − direct costs on delivered cycles. *After owner time = revenue − all incurred contract costs − recorded contract hours × current owner target. It excludes shared overhead, outreach and time on declined new quotes. Open cycles can make this interim result negative. Contract totals will not equal the whole-business result.</p>`;
}
function simulationAnalyticsView(a,m){
 const max=Math.max(1,...a.monthly.map(r=>Math.max(r.revenue,Math.abs(r.profit))));
 return `<div class="metrics">${metric('New quote conversion',analyticsRate(a.conversion),a.won+' accepted / '+(a.won+a.lost)+' decided')}${metric('Returning cycle share',analyticsRate(a.repeatShare),a.repeatCycles+' accepted returning cycles')}${metric('On-time delivery',analyticsRate(m.onTimeRate),m.lateCompleted+' delivered late')}${metric('Average delivery lead time',m.averageAcceptedLeadDays===null?'—':num(m.averageAcceptedLeadDays)+' d','Acceptance to delivery')}</div>
 <div class="two-col"><section class="panel padded"><h2>Monthly revenue & operating result</h2><div class="trend-legend"><span>▰ Revenue</span><span>━ Operating result (signed)</span></div>${a.monthly.map(r=>`<div class="trend-row"><b>M${r.month}${r.days<30?' · partial':''}</b><div><div class="trend-line"><span class="trend-bar" style="width:${r.revenue/max*100}%"></span><span>${money(r.revenue)}</span></div><div class="trend-line"><span class="trend-bar result ${r.profit<0?'loss':''}" style="width:${Math.abs(r.profit)/max*100}%"></span><span>${money(r.profit)}</span></div></div></div>`).join('')}<p class="helper">Common dollar scale; negative results are labeled with a minus sign. Partial months are not directly comparable with full 30-day months.</p></section><section class="panel padded"><h2>Pipeline & delivery health</h2>${analyticsRows([['Served / unserved external inquiries',a.external+' / '+m.unserved],['New quotes still undecided',a.pending],['Clients with accepted work',a.uniqueClients],['Late open deliveries',m.late],['Oldest quote',m.oldestQuoteAge+' d'],['Remaining owner / design work',num(m.ownerOpenHours)+' / '+num(m.designerOpenHours)+' h'],['Overdue final payments',m.overduePayments],['Owner / design hours recorded',num(state.ownerHours)+' / '+num(state.designHours)+' h']])}<p class="helper">Conversion excludes undecided quotes and returning orders. Returning share measures orders, not customer retention. Late deliveries and overdue payments are separate.</p></section></div>
 <section class="panel analytics-section"><div class="panelhead"><h2>Monthly detail</h2><span class="tag">30-DAY MODEL MONTHS</span></div>${analyticsTable(['Month','Revenue','Incurred costs','Operating result','Margin','After owner time','Delivered'],a.monthly.map(r=>`<tr><td>${r.month}${r.days<30?'<small>Partial · '+r.days+' days</small>':''}</td><td>${money(r.revenue)}</td><td>${money(r.cost)}</td>${resultCell(r.profit)}<td>${analyticsRate(r.margin)}</td>${resultCell(r.afterOwner)}<td>${r.delivered}</td></tr>`))}</section>
 <section class="panel analytics-section"><div class="panelhead"><div><h2>Simulation comparison</h2><p class="helper">Pinned baseline, current run and saved checkpoints · compare equal days and matching demand assumptions</p></div>${btn('Save checkpoint','checkpoint','soft')}</div>${analyticsTable(['Run','Day','Revenue','Operating result','Margin','After owner time','Delivered'],[state,...saved].map((s,i)=>{const n=QQ.metrics(s),r={profit:n.profit,operatingMargin:s.revenue>0?n.profit/s.revenue:null,afterOwner:n.surplus},base=i>0&&checkpointInfo[i-1]?.baseline;return `<tr class="${base?'baseline-row':''}"><td>${base?badge('BASELINE')+' ':''}${esc(i===0?'Current · '+s.config.name:checkpointInfo[i-1]?.label||s.config.name)}<small>${s.day===state.day?'Same day':'Different day'} · ${s.workloadId===state.workloadId?'Same seed identity':'Different demand identity'}</small></td><td>${s.day}</td><td>${money(s.revenue)}</td>${resultCell(r.profit)}<td>${analyticsRate(r.operatingMargin)}</td>${resultCell(r.afterOwner)}<td>${n.delivered}</td></tr>`;}))}<p class="helper analytics-note">Pin the reference under Runs & backups. A matching seed identity does not guarantee equal demand settings. Results after owner time use each run's own target.</p></section>`;
}
</script></body></html>
